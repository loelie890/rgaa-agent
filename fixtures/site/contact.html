<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Contact — Tilleul &amp; Cie</title>
</head>
<body>
  <main>
    <h1>Nous contacter</h1>
    <p>Boutique ouverte du mardi au samedi, de 10 h à 19 h (adresse fictive).</p>
    <img id="shop-photo" src="boutique.png" alt="Façade de la boutique, un vélo exposé en vitrine">
    <form action="/contact" method="post">
      <label for="nom">Votre nom</label>
      <input id="nom" type="text">
      <label for="message">Votre message</label>
      <input id="message" type="text">
      <button type="submit">Envoyer</button>
    </form>
    <table class="horaires">
      <tr><th>Jour</th><th>Ouverture</th></tr>
      <tr><td>Mardi</td><td>10 h — 19 h</td></tr>
    </table>
    <iframe src="https://maps.example.invalid/embed" title="Plan d'accès à la boutique"></iframe>
  </main>
</body>
</html>
