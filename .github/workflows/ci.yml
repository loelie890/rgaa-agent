name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  tests:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Tests unitaires
        run: python -m unittest discover -s tests -v

      - name: Validation des cassettes
        run: python -m rgaa validate

      - name: Tous les campagnes par la CLI
        run: |
          set -e
          for slug in $(python -m rgaa list | awk '{print $1}'); do
            echo "── $slug"
            python -m rgaa run "$slug"
          done

      - name: Mode CI, seuil atteint (sortie 0)
        run: |
          set -e
          rm -rf /tmp/site-ci && cp -r fixtures/site /tmp/site-ci
          python -m rgaa ci /tmp/site-ci --min-score 100 --diff /tmp/rgaa.patch.diff --report /tmp/rapport-rgaa.html
          test -s /tmp/rgaa.patch.diff
          grep -q "Rapport d'accessibilité" /tmp/rapport-rgaa.html
          grep -q '^+++ b/tarifs.html' /tmp/rgaa.patch.diff

      - name: Mode CI, seuil non atteint (sortie 1)
        run: |
          set -e
          rm -rf /tmp/site-ko && cp -r fixtures/site /tmp/site-ko
          if python -m rgaa ci /tmp/site-ko --min-score 101 --diff /tmp/ko.diff; then
            echo "le mode CI aurait dû échouer avec un seuil inatteignable"
            exit 1
          fi
          echo "code de sortie 1 attendu et obtenu"

  image:
    name: image (GHCR)
    needs: tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: rgaa-agent          # minuscules obligatoires pour GHCR
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Détection du token Docker Hub
        id: hub
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: Connexion GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Connexion Docker Hub (optionnelle)
        if: steps.hub.outputs.ok == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Métadonnées
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  smoke:
    name: smoke (conteneur réel)
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t rgaa-agent:smoke .

      - name: Démarrer le conteneur
        run: docker run -d --name rgaa -p 8080:8080 rgaa-agent:smoke

      - name: Attendre /healthz
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then echo; exit 0; fi
            sleep 1
          done
          docker logs rgaa
          exit 1

      - name: Lancer la mise en conformité par l'API et vérifier le score
        run: |
          python - <<'PY'
          import json, urllib.request
          request = urllib.request.Request(
              "http://127.0.0.1:8080/api/run",
              data=json.dumps({"campagne": "conformite", "mode": "replay"}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          result = json.load(urllib.request.urlopen(request, timeout=180))
          assert result["status"] == "done", result
          assert result["errors"] == 0, result
          url = f"http://127.0.0.1:8080/api/artifact?run={result['run_id']}&name=deliverables/audit-rgaa.md"
          report = urllib.request.urlopen(url, timeout=30).read().decode("utf-8")
          assert "48/48" in report, report[:400]
          assert "Conformité" in report, "charset cassé"
          page = urllib.request.urlopen(
              f"http://127.0.0.1:8080/api/artifact?run={result['run_id']}&name=index.html", timeout=30
          ).read().decode("utf-8")
          assert 'lang="fr"' in page, "page non corrigée dans le conteneur"
          print(f"conformite {result['run_id']} → 36/36, page corrigée servie")
          PY

      - name: Journaux si échec
        if: failure()
        run: docker logs rgaa || true
