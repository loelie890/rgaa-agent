name: Build and Publish Docker Image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: rgaa-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image par défaut : ni navigateur ni modèle, environ 45 Mo, tirée en quelques secondes.
      - name: Build and push (minimale)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            INSTALL_BROWSER=0
            INSTALL_OLLAMA=0
            BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Avec Chromium et Xvfb, environ 330 Mo : rendu réel, headless ou headful.
      - name: Build and push (navigateur)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            INSTALL_BROWSER=1
            INSTALL_OLLAMA=0
            BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}:browser
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}:sha-${{ github.sha }}-browser
          cache-from: type=gha

      # Image complète : Chromium et Ollama, environ 2,2 Go, pour la démo hors ligne.
      - name: Build and push (avec Ollama)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            INSTALL_BROWSER=1
            INSTALL_OLLAMA=1
            BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}:ollama
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}:sha-${{ github.sha }}-ollama
          cache-from: type=gha
